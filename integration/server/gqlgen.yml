schema:
    - schema/**/*.graphql

exec:
    filename: generated.go
model:
    filename: models-go/generated.go

struct_tag: json

autobind:
    - "github.com/spiffdev/gqlgen/integration/server/testomitempty"

models:
    Element:
        model: github.com/spiffdev/gqlgen/integration/server/models-go.Element
    Viewer:
        model: github.com/spiffdev/gqlgen/integration/server/models-go.Viewer
    User:
        model: github.com/spiffdev/gqlgen/integration/server/remote_api.User
        fields:
            likes:
                resolver: true
